[project]
name = "incident-agent"
version = "0.1.0"
description = "LLM incident responder agent with a fault-injectable FastAPI service and eval harness"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "openai>=3.49.0",
    "pydantic>=2.14.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls real LLM provider APIs (opt-in: pytest -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
